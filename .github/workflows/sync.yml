name: Sync playlist

# Roz iptv-org se latest playlist fetch karke repo mein commit karta hai
on:
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC (subah 8:30 IST)
  workflow_dispatch:       # manual "Run workflow" button bhi

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Latest playlist download (iptv-org)
        run: |
          curl -sL -o iptv/index.m3u https://iptv-org.github.io/iptv/index.m3u
          echo "Channels: $(grep -c '^#EXTINF' iptv/index.m3u)"

      - name: Commit & push (sirf tab jab change ho)
        run: |
          git config user.name "iptv-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/index.m3u
          if git diff --cached --quiet; then
            echo "Koi change nahi — skip"
          else
            git commit -m "Auto-sync playlist $(date -u +%Y-%m-%d)"
            git push
          fi
